id: "R-00"
versao: "14.0"
manual: "Recepcao"
titulo: "Primeiro Atendimento e Triagem"
automacao: { nivel: "IA_AUDITA", aprovacao_humana: true }
regras_de_decisao:
  - condicao: "Procura Endodontia, Exodontia, Periodontia ou Odontopediatria"
    acao: "Fora do escopo da clínica. Indicar profissionais parceiros."
    efeito: "bloquear"
    palavras_chave: ["canal", "endodontia", "tratamento de canal", "extrair", "extração", "exodontia", "siso", "periodontia", "gengiva", "odontopediatria", "criança", "filho", "filha"]
  # Decisão do RT: escopo ampliado além dos 4 serviços do documento original.
  - condicao: "Procura serviço realizado pela clínica (orto, alinhadores, PPR, PT, restaurações, lentes, coroas, bruxismo, implantes, clareamento, facetas em resina, próteses)"
    acao: "Serviço realizado pela clínica. Encaminhar para agendamento."
    efeito: "encaminhar_agendamento"
    palavras_chave: ["orto", "ortodontia", "aparelho", "alinhador", "ppr", "pt", "protese", "dentadura", "ponte", "restauracao", "restaurar", "lente", "coroa", "bruxismo", "implante", "clareamento", "clarear", "faceta"]
  - condicao: "Paciente já atendido pela clínica pede serviço fora do escopo"
    acao: "Dentista faz o primeiro atendimento e encaminha. A IA não decide nada clínico."
    efeito: "atendimento_clinico_humano"
mensagens:
  fora_do_escopo: "Senhor(a) {nome}, agradecemos o contato. Este procedimento não é realizado pela clínica; indicaremos profissionais parceiros. Nossa equipe retornará em breve."
